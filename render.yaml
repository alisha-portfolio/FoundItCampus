# Render Blueprint for the backend. A persistent disk requires a paid instance
# type (starter or above). On the free tier the SQLite file is wiped on every
# redeploy/restart; see README "SQLite hosting limitations".
services:
  - type: web
    name: findit-campus-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: findit-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_PATH
        value: /var/data/findit.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: UNIVERSITY_NAME
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
